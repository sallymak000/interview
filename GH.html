<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小一面試挑戰：圖像重量與數理連線</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    background-color: #f0fdf4;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  /* 放大標題 */
  h1 { color: #166534; font-size: 2rem; margin-bottom: 8px; text-align: center; }
  p.subtitle { color: #374151; font-size: 1.25rem; margin-bottom: 15px; text-align: center; font-weight: 500; }
  
  .game-container {
    position: relative;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    max-width: 950px;
    width: 100%;
  }

  /* 放大計分板同頁碼指示 */
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #dcfce7;
    padding: 12px 20px;
    border-radius: 12px;
    margin-bottom: 15px;
  }
  
  .page-indicator {
    font-size: 1.4rem;
    font-weight: bold;
    color: #15803d;
  }

  .score-board {
    font-size: 1.4rem;
    font-weight: bold;
    color: #15803d;
  }

  .matching-board {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 100px;
    margin: 15px 0;
    min-height: 480px; /* 給 5 條大卡片足夠高度 */
  }

  #lineCanvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }

  .column { display: flex; flex-direction: column; gap: 15px; flex: 1; z-index: 5; }

  /* 放大卡片與邊框 */
  .card {
    background: #ffffff;
    border: 3px solid #bbf7d0;
    border-radius: 15px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
    min-height: 80px;
  }

  .card:hover { border-color: #16a34a; background: #f0fdf4; }
  
  .card.selected {
    border-color: #f59e0b;
    background: #fef3c7;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
  }

  /* 放大幅面題號圈圈 */
  .q-badge {
    background: #166534; color: white; font-weight: bold; border-radius: 50%;
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; margin-right: 15px; flex-shrink: 0;
  }

  .a-badge {
    background: #0284c7; color: white; font-weight: bold; border-radius: 10px;
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; margin-right: 15px; flex-shrink: 0;
  }

  /* 放大題目內文字體 */
  .card-content {
    font-size: 1.3rem;
    color: #1e293b;
    font-weight: 600;
    line-height: 1.4;
    width: 100%;
  }

  /* 放大天平圖形 */
  .scale-svg { width: 180px; height: 60px; display: block; margin-top: 6px; }

  /* 控制按鈕專區 */
  .nav-btn-container {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }

  button {
    background-color: #16a34a;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 1.25rem;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.12);
    transition: transform 0.1s, background 0.2s;
  }

  button:hover { background-color: #15803d; transform: translateY(-2px); }
  button:disabled { background-color: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }
  
  .submit-btn { background-color: #2563eb; }
  .submit-btn:hover { background-color: #1d4ed8; }
  .reset-btn { background-color: #64748b; }
</style>
</head>
<body>

<h1>🏫 小一面試挑戰：圖像重量與數理連線</h1>
<p class="subtitle">👉 先點左邊【數字題卡】，再點右邊對應【英文字母答案】連線！</p>

<div class="game-container">
  <div class="header-bar">
    <div class="page-indicator" id="pageIndicator">第一頁 (第 1 - 5 題)</div>
    <div class="score-board" id="scoreBoard">得分：0 / 100 分</div>
  </div>
  
  <div class="matching-board" id="matchingBoard">
    <canvas id="lineCanvas"></canvas>
    <div class="column" id="questionsCol"></div>
    <div class="column" id="answersCol"></div>
  </div>

  <div class="nav-btn-container">
    <button id="prevBtn" onclick="changePage(-1)" disabled>⬅️ 上一頁</button>
    <div>
      <button class="submit-btn" onclick="checkAnswers()">提交答案 📝</button>
      <button class="reset-btn" onclick="resetGame()">重新開始 🔄</button>
    </div>
    <button id="nextBtn" onclick="changePage(1)">下一頁 ➡️</button>
  </div>
</div>

<script>
const questionsData = [
  { id: 1, q: "12 + 4 = ?", a: "16" },
  { id: 2, q: "1 + 2 + 3 = ?", a: "6" },
  { id: 3, q: "18 - 5 = ?", a: "13" },
  { 
    id: 4, 
    q: `邊個比較重？<br>
        <svg class="scale-svg" viewBox="0 0 160 55">
          <polygon points="80,25 72,50 88,50" fill="#64748b" />
          <rect x="65" y="48" width="30" height="4" fill="#334155" />
          <g transform="rotate(-12, 80, 25)">
            <line x1="20" y1="25" x2="140" y2="25" stroke="#475569" stroke-width="3" />
            <line x1="25" y1="25" x2="25" y2="38" stroke="#94a3b8" stroke-width="1.5" />
            <path d="M 10 38 L 40 38 L 35 44 L 15 44 Z" fill="#cbd5e1" stroke="#64748b" />
            <text x="25" y="35" font-size="16" text-anchor="middle">🍌</text>
            <line x1="135" y1="25" x2="135" y2="38" stroke="#94a3b8" stroke-width="1.5" />
            <path d="M 120 38 L 150 38 L 145 44 L 125 44 Z" fill="#cbd5e1" stroke="#64748b" />
            <text x="135" y="35" font-size="16" text-anchor="middle">🍎</text>
          </g>
        </svg>`, 
    a: "🍌 較重" 
  },
  { 
    id: 5, 
    q: `邊個比較重？<br>
        <svg class="scale-svg" viewBox="0 0 160 55">
          <polygon points="80,25 72,50 88,50" fill="#64748b" />
          <rect x="65" y="48" width="30" height="4" fill="#334155" />
          <g transform="rotate(-12, 80, 25)">
            <line x1="20" y1="25" x2="140" y2="25" stroke="#475569" stroke-width="3" />
            <line x1="25" y1="25" x2="25" y2="38" stroke="#94a3b8" stroke-width="1.5" />
            <path d="M 10 38 L 40 38 L 35 44 L 15 44 Z" fill="#cbd5e1" stroke="#64748b" />
            <text x="25" y="35" font-size="16" text-anchor="middle">🍎</text>
            <line x1="135" y1="25" x2="135" y2="38" stroke="#94a3b8" stroke-width="1.5" />
            <path d="M 120 38 L 150 38 L 145 44 L 125 44 Z" fill="#cbd5e1" stroke="#64748b" />
            <text x="135" y="35" font-size="16" text-anchor="middle">🍌</text>
          </g>
        </svg>`, 
    a: "🍎 較重" 
  },
  { 
    id: 6, 
    q: `1個木瓜等於幾個蘋果重？<br>
        <svg class="scale-svg" viewBox="0 0 160 55">
          <polygon points="80,25 72,50 88,50" fill="#64748b" />
          <rect x="65" y="48" width="30" height="4" fill="#334155" />
          <line x1="20" y1="25" x2="140" y2="25" stroke="#475569" stroke-width="3" />
          <line x1="25" y1="25" x2="25" y2="38" stroke="#94a3b8" stroke-width="1.5" />
          <path d="M 10 38 L 40 38 L 35 44 L 15 44 Z" fill="#cbd5e1" stroke="#64748b" />
          <text x="25" y="35" font-size="16" text-anchor="middle">🍈</text>
          <line x1="135" y1="25" x2="135" y2="38" stroke="#94a3b8" stroke-width="1.5" />
          <path d="M 115 38 L 155 38 L 150 44 L 120 44 Z" fill="#cbd5e1" stroke="#64748b" />
          <text x="135" y="35" font-size="12" text-anchor="middle">🍎🍎🍎🍎</text>
        </svg>`, 
    a: "4 " 
  },
  { id: 7, q: "🐱 比 🐰 重，🐶 比 🐱 重。<br>邊隻動物<b>最輕</b>？", a: "🐰 " },
  { id: 8, q: "🐶 比 🐰 重，🐰 比 🐱 重。<br>邊隻動物<b>最輕</b>？", a: "🐱 " },
  { id: 9, q: "🍉1個西瓜 = 🍍🍍2個菠蘿<br>🍍1個菠蘿 = 🍎🍎🍎3個蘋果<br>問：🍉1個西瓜 = 幾多個🍎？", a: "6" },
  { 
    id: 9, 
    q: `🎁 禮物盒重幾多 g？<br>
        <svg class="scale-svg" viewBox="0 0 160 55">
          <polygon points="80,25 72,50 88,50" fill="#64748b" />
          <rect x="65" y="48" width="30" height="4" fill="#334155" />
          <line x1="20" y1="25" x2="140" y2="25" stroke="#475569" stroke-width="3" />
          <line x1="30" y1="25" x2="30" y2="38" stroke="#94a3b8" stroke-width="1.5" />
          <path d="M 10 38 L 50 38 L 45 44 L 15 44 Z" fill="#cbd5e1" stroke="#64748b" />
          <text x="30" y="35" font-size="12" font-weight="bold" text-anchor="middle">🎁+2g</text>
          <line x1="130" y1="25" x2="130" y2="38" stroke="#94a3b8" stroke-width="1.5" />
          <path d="M 110 38 L 150 38 L 145 44 L 115 44 Z" fill="#cbd5e1" stroke="#64748b" />
          <text x="130" y="35" font-size="12" font-weight="bold" text-anchor="middle">10g</text>
        </svg>`, 
    a: "8" 
  },
  { id: 10, q: "📦A 比 📦B 重，📦C 比 📦A 重。<br>邊個盒子<b>最重</b>？", a: "📦 C 盒子最重" }
];

let currentPage = 1; // 1代表1-5題，2代表6-10題
let selectedQ = null;
let connections = {}; // 記錄連線對應關係
let page1Answers = [];
let page2Answers = [];
let lastResults = null;

const lettersPage1 = ['A', 'B', 'C', 'D', 'E'];
const lettersPage2 = ['F', 'G', 'H', 'I', 'J'];

function shuffle(array) { return [...array].sort(() => Math.random() - 0.5); }

function initGame() {
  currentPage = 1;
  selectedQ = null;
  connections = {};
  lastResults = null;
  document.getElementById('scoreBoard').innerText = '得分：0 / 100 分';

  // 獨立打亂第一頁與第二頁答案順序
  page1Answers = shuffle(questionsData.slice(0, 5));
  page2Answers = shuffle(questionsData.slice(5, 10));

  renderPage();
}

function renderPage() {
  selectedQ = null;
  const qCol = document.getElementById('questionsCol');
  const aCol = document.getElementById('answersCol');
  qCol.innerHTML = '';
  aCol.innerHTML = '';

  const startIndex = (currentPage - 1) * 5;
  const currentQuestions = questionsData.slice(startIndex, startIndex + 5);
  const currentAnswers = currentPage === 1 ? page1Answers : page2Answers;
  const currentLetters = currentPage === 1 ? lettersPage1 : lettersPage2;

  // 更新頁碼指示與按鈕狀態
  document.getElementById('pageIndicator').innerText = currentPage === 1 ? '第一頁 (第 1 - 5 題)' : '第二頁 (第 6 - 10 題)';
  document.getElementById('prevBtn').disabled = (currentPage === 1);
  document.getElementById('nextBtn').disabled = (currentPage === 2);

  // 渲染題目
  currentQuestions.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card q-card';
    card.dataset.id = item.id;
    card.innerHTML = `<div class="q-badge">${startIndex + index + 1}</div><div class="card-content">${item.q}</div>`;
    card.onclick = () => selectQuestion(card, item.id);
    qCol.appendChild(card);
  });

  // 渲染答案
  currentAnswers.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card a-card';
    card.dataset.id = item.id;
    card.innerHTML = `<div class="a-badge">${currentLetters[index]}</div><div class="card-content">${item.a}</div>`;
    card.onclick = () => selectAnswer(card, item.id);
    aCol.appendChild(card);
  });

  setTimeout(resizeCanvas, 100);
}

function changePage(direction) {
  currentPage += direction;
  renderPage();
}

function resizeCanvas() {
  const canvas = document.getElementById('lineCanvas');
  const board = document.getElementById('matchingBoard');
  canvas.width = board.clientWidth;
  canvas.height = board.clientHeight;
  drawLines();
}

function selectQuestion(card, qId) {
  document.querySelectorAll('.q-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  selectedQ = qId;
}

function selectAnswer(card, aId) {
  if (selectedQ === null) {
    alert('請先點擊左邊題目，再點擊右邊答案！');
    return;
  }
  connections[selectedQ] = aId;
  document.querySelectorAll('.q-card').forEach(c => c.classList.remove('selected'));
  selectedQ = null;
  drawLines();
}

function drawLines() {
  const canvas = document.getElementById('lineCanvas');
  const ctx = canvas.getContext('2d');
  const boardRect = document.getElementById('matchingBoard').getBoundingClientRect();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const startIndex = (currentPage - 1) * 5 + 1;
  const endIndex = startIndex + 4;

  for (let qId = startIndex; qId <= endIndex; qId++) {
    if (connections[qId]) {
      const aId = connections[qId];
      const qEl = document.querySelector(`.q-card[data-id="${qId}"]`);
      const aEl = document.querySelector(`.a-card[data-id="${aId}"]`);

      if (qEl && aEl) {
        const qRect = qEl.getBoundingClientRect();
        const aRect = aEl.getBoundingClientRect();
        const startX = qRect.right - boardRect.left;
        const startY = qRect.top + qRect.height / 2 - boardRect.top;
        const endX = aRect.left - boardRect.left;
        const endY = aRect.top + aRect.height / 2 - boardRect.top;

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(startX + 40, startY, endX - 40, endY, endX, endY);
        ctx.lineWidth = 5;
        
        if (lastResults) {
          ctx.strokeStyle = lastResults[qId] ? '#16a34a' : '#dc2626'; // 對綠錯紅
        } else {
          ctx.strokeStyle = '#2563eb'; // 預設藍線
        }
        ctx.stroke();
      }
    }
  }
}

function checkAnswers() {
  if (Object.keys(connections).length < 10) {
    if (!confirm('仲有題目未連線完（可以禁下一頁做埋第6-10題），確定要依家提交答案？')) return;
  }

  let score = 0;
  lastResults = {};
  questionsData.forEach(q => {
    if (connections[q.id] === q.id) {
      score += 10;
      lastResults[q.id] = true;
    } else {
      lastResults[q.id] = false;
    }
  });

  drawLines();
  document.getElementById('scoreBoard').innerText = `得分：${score} / 100 分 ${score === 100 ? '🎉 全對好棒！' : '💪 繼續努力！'}`;
}

function resetGame() { initGame(); }

window.onload = initGame;
window.onresize = resizeCanvas;
</script>

</body>
</html>
